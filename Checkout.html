<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - NurturePath Lactation Services</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Checkout</h1>
    </header>
    
    <nav>
        <a href="index.html">Homepage</a>
        <a href="services.html">Consultations & Services</a>
        <a href="shop.html">Shop Supplies</a>
        <a href="checkout.html">Checkout</a>
    </nav>

    <main class="container">
        <h2>Complete Your Order</h2>
        
        <div class="form-section">
            <h3>Review Your Cart</h3>
            <div id="checkout-items-container">
                <!-- JavaScript will inject the cart items, qtys, and buttons here -->
            </div>
            <br>
            <div class="total-display">
                Order Total: $<span id="order-total">0.00</span>
            </div>
        </div>

        <div class="form-section coupon-section">
            <label for="coupon-code">Coupon Code:</label>
            <input type="text" id="coupon-code" placeholder="Try 'NURTURE20'">
            <button type="button" class="cta-button" onclick="applyCoupon()">Apply</button>
            <span id="coupon-message"></span>
        </div>

        <form id="checkout-form" onsubmit="return validateCheckout(event)">
            <div class="form-section">
                <h3>Shipping Information</h3>
                <div class="form-group"><label for="ship-name">Full Name *</label><input type="text" id="ship-name" required></div>
                <div class="form-group"><label for="ship-address">Street Address *</label><input type="text" id="ship-address" required></div>
                <div class="form-group"><label for="ship-city">City *</label><input type="text" id="ship-city" required></div>
                <div class="form-group"><label for="ship-state">State *</label><input type="text" id="ship-state" required></div>
                <div class="form-group"><label for="ship-zip">ZIP Code *</label><input type="text" id="ship-zip" required></div>
                <div class="form-group"><label for="ship-phone">Phone Number *</label><input type="tel" id="ship-phone" required></div>
            </div>

            <div class="form-section">
                <h3>Payment Information</h3>
                <div class="form-group"><label for="card-name">Cardholder Name *</label><input type="text" id="card-name" required></div>
                <div class="form-group"><label for="card-num">Credit Card Number *</label><input type="text" id="card-num" required></div>
                <div class="form-group"><label for="card-exp">Expiration Date (MM/YY) *</label><input type="text" id="card-exp" required></div>
                <div class="form-group"><label for="card-cvv">Security Code (CVV) *</label><input type="text" id="card-cvv" required></div>
            </div>

            <button type="submit" class="cta-button">Place Order</button>
        </form>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
